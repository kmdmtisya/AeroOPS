services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeroops
      POSTGRES_USER: aeroops
      POSTGRES_PASSWORD: aeroops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroops"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the issuer to the docker-network name/port regardless of which host:port
      # a caller actually used to reach Keycloak (dev mode otherwise derives the
      # issuer from the request's Host header, which differs for host vs container
      # callers and breaks the API's JWT issuer validation). Keycloak 25 defaults to
      # the hostname:v2 feature, which reads KC_HOSTNAME as a full URL, not the v1
      # KC_HOSTNAME_URL/KC_HOSTNAME_ADMIN_URL pair.
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  api:
    build:
      context: ../services/api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aeroops
      DB_USER: aeroops
      DB_PASSWORD: aeroops
      OIDC_ISSUER_URI: http://keycloak:8080/realms/aeroops
      SPRING_PROFILES_ACTIVE: dev
    ports:
      # Host port 8082 avoids a collision with other local projects already on 8080;
      # the container's internal port stays 8080 (see nginx.conf's proxy_pass to api:8080).
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: ../apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
